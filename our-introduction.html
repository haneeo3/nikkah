function App(){
  useEffect(()=>{const items=document.querySelectorAll('.reveal');if(!('IntersectionObserver' in window)){items.forEach(x=>x.classList.add('visible'));return;}
    const observer=new IntersectionObserver(entries=>entries.forEach(entry=>entry.target.classList.toggle('visible',entry.isIntersecting)),{threshold:.12});items.forEach(x=>observer.observe(x));return()=>observer.disconnect();},[]);

const giftButton=document.getElementById('open-gift');
const giftGate=document.getElementById('gift-gate');
giftButton.disabled=false;giftButton.textContent='Tap to open your gift';
giftButton.addEventListener('click',()=>{
  giftGate.classList.add('opening');
  document.body.classList.remove('locked');
  const root=document.getElementById('root');root.removeAttribute('aria-hidden');
  giftButton.disabled=true;

  setTimeout(()=>{giftGate.remove();const main=root.querySelector('main');if(main){main.setAttribute('tabindex','-1');main.focus({preventScroll:true});}},delay);
},{once:true});
